name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Unit tests (Debug and ReleaseSafe)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1
      - run: zig build test
      - run: zig build test -Doptimize=ReleaseSafe

  interop:
    name: Interoperability and differential tests against zlib and gzip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1
      - run: python3 scripts/corpus.py
      - run: python3 scripts/interop.py
